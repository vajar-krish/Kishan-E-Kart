<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Buy</title>
    <link rel="icon" type="image/png" href="images/logo-small.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
      <div class="header-logo">
    <img src="images/logo.png" alt="Logo" class="logo-img">
    <h2>KISHAN E-KART</h2>
</div>
        <div class="search-bar-container">
            <input type="text" placeholder="Search for products...">
            <button class="search-btn">🔍</button>
        </div>
        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="categories.html" class="active">Buy</a>
            <a href="my-listings.html">Sell</a>
            <a href="rent.html">Rent</a>
        </nav>
    </header>

    <div class="breadcrumb">
        <p><a href="home.html">Home</a> > <a href="categories.html">Seeds</a> > <span>Wheat Seeds</span></p>
    </div>

    <main class="details-container">
        <div class="details-image-section">
            <div class="big-img-holder">🌾</div>
        </div>

        <div class="details-info-section">
            <h1 id="prodName">Wheat Seeds</h1>
            <div class="rating">⭐⭐⭐⭐⭐ <span class="reviews-count">(125 Reviews)</span></div>
            
            <h2 class="price-tag" id="prodPrice">₹350 / kg</h2>
            
            <p class="description">High quality wheat seeds suitable for good yield. Cleaned and processed for best results.</p>
            
            <p class="stock-status">Available Stock: <span>50 kg</span></p>

            <div class="purchase-actions">
                <div class="quantity-box">
                    <label>Quantity: </label>
                    <input type="number" id="prodQuantity" value="1" min="1">
                </div>
                <div class="btn-group">
                    <button class="add-cart-btn" onclick="addDetailedToCart()">Add to Cart</button>
                    <button class="buy-now-btn">Buy Now</button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
