<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent - Equipment List</title>
    <link rel="icon" type="image/png" href="images/logo-small.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="main-header">
        <div class="header-logo">
            <img src="images/logo.png" alt="Logo" class="logo-img">
            <h2>KISHAN E-KART</h2>
        </div>
        <div class="search-bar-container">
            <input type="text" placeholder="Search for products...">
            <button class="search-btn">🔍</button>
        </div>
        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="categories.html">Buy</a>
            <a href="my-listings.html">Sell</a>
            <a href="rent.html" class="active">Rent</a>
        </nav>
    </header>

    <div class="layout-container">
        <aside class="sidebar-menu">
            <h3>Categories</h3>
            <ul>
                <li><a href="#" class="active">Tractors</a></li>
                <li><a href="#">Tillers</a></li>
                <li><a href="#">Harvesters</a></li>
                <li><a href="#">Sprayers</a></li>
                <li><a href="#">Irrigation</a></li>
                <li><a href="#">Other Equipment</a></li>
            </ul>
        </aside>

        <main class="content-area">
            <h2>Rent Equipment</h2>

            <div class="products-grid">
                <div class="product-card">
                    <div class="product-img-holder" style="background: none;">
                        <img src="images/tractor.png" alt="Tractor"
                            style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div class="product-info">
                        <h3>Tractor</h3>
                        <p class="product-price">₹1,500 / day</p>
                        <button class="view-details-btn">View Details</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-img-holder" style="background: none;">
                        <img src="images/rotavator.png" alt="Rotavator"
                            style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div class="product-info">
                        <h3>Rotavator</h3>
                        <p class="product-price">₹800 / day</p>
                        <button class="view-details-btn">View Details</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-img-holder" style="background: none;">
                        <img src="images/sprayer.png" alt="Sprayer"
                            style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div class="product-info">
                        <h3>Sprayer</h3>
                        <p class="product-price">₹600 / day</p>
                        <button class="view-details-btn">View Details</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-img-holder" style="background: none;">
                        <img src="images/harvester.png" alt="Harvester"
                            style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div class="product-info">
                        <h3>Harvester</h3>
                        <p class="product-price">₹2,000 / day</p>
                        <button class="view-details-btn">View Details</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
